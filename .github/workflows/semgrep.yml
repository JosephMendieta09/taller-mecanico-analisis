name: Semgrep Security Scan

on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    name: Analisis de seguridad Laravel
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Verificar archivos del proyecto
        run: |
          echo "Directorio actual:"
          pwd

          echo ""
          echo "Archivos principales:"
          find . -maxdepth 2 -type f | sort | head -200

          echo ""
          echo "Archivos PHP encontrados:"
          find . -type f -name "*.php" \
            -not -path "./vendor/*" \
            -not -path "./storage/*" | sort

      - name: Instalar Semgrep
        run: |
          python3 -m pip install semgrep

      - name: Ejecutar Semgrep
        run: |
          semgrep \
            --config=auto \
            --exclude=vendor \
            --exclude=storage \
            --sarif \
            --output=semgrep-results.sarif \
            .

      - name: Subir resultados a GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep
