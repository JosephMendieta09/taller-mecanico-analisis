name: Semgrep PHP Laravel Security Scan

on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    name: Analisis de seguridad PHP Laravel
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v6

      - name: Mostrar archivos PHP que seran analizados
        run: |
          echo "Repositorio analizado:"
          echo "$GITHUB_REPOSITORY"

          echo ""
          echo "Commit analizado:"
          echo "$GITHUB_SHA"

          echo ""
          echo "Rama:"
          echo "$GITHUB_REF_NAME"

          echo ""
          echo "Archivos PHP encontrados:"
          find app bootstrap config database public routes tests \
            -type f -name "*.php" \
            -not -path "*/vendor/*" \
            -not -path "*/storage/*" \
            | sort

      - name: Instalar Semgrep
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install semgrep

      - name: Ejecutar analisis de seguridad PHP Laravel
        run: |
          semgrep scan \
            --config=auto \
            --include="*.php" \
            --exclude=".github" \
            --exclude="vendor" \
            --exclude="storage" \
            --exclude="resources/views" \
            --sarif \
            --output=semgrep-results.sarif \
            app \
            bootstrap \
            config \
            database \
            public \
            routes \
            tests

      - name: Subir resultados a GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep-php-laravel

      - name: Guardar informe SARIF
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-php-laravel-report
          path: semgrep-results.sarif
          retention-days: 30
